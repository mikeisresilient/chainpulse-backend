[package]
name = "chainpulse-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "tls-rustls", "chrono", "bigdecimal"] }
chrono = { version = "0.4.45", features = ["serde"] }
alloy-primitives = { version = "1.6.1", features = ["std"] }
alloy-provider = { version = "2.4.1", features = ["reqwest"] }
alloy-rpc-types = "2.4.1"
alloy-sol-types = "1.6.1"
alloy-contract = "2.4.1"
reqwest = { version = "0.13.4", features = ["json"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
